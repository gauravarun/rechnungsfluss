[project]
name = "rechnungsfluss"
version = "0.1.0"
description = "E-invoice processing platform for a fictional German company (portfolio project)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "factur-x==7.3",
    "lxml==6.1.3",
    "pydantic==2.13.5",
    "reportlab==5.0.1",
]

[dependency-groups]
dev = [
    "hypothesis==6.168.3",
    "lxml-stubs==0.5.1",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.10",
    "types-reportlab==5.0.0.20260911",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rechnungsfluss"]

[tool.uv]
# Rule from ADR-0013: every dependency, including transitive ones, must be at
# least two weeks old when added. Bump this date deliberately when upgrading.
exclude-newer = "2026-10-05T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "N", "SIM", "RUF", "PT", "DTZ", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
# factur-x ships no type information; its use is confined to formats/zugferd.py.
module = ["facturx", "facturx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "tenancy: tests that assert cross-tenant isolation",
    "kosit: integration tests against the KoSIT validator daemon",
]
