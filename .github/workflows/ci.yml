name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: lint, types, unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .tools/kosit
          key: kosit-${{ hashFiles('scripts/kosit.sh') }}
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: start KoSIT validator daemon
        run: |
          scripts/kosit.sh fetch
          nohup scripts/kosit.sh start > kosit.log 2>&1 &
          scripts/kosit.sh wait
      - name: unit + integration tests (KoSIT required, never skipped)
        env:
          RF_REQUIRE_KOSIT: "1"
          RF_KOSIT_URL: http://127.0.0.1:8081
        run: uv run pytest --cov=rechnungsfluss --cov-report=term-missing --cov-fail-under=90
      - name: KoSIT log on failure
        if: failure()
        run: cat kosit.log || true

  web:
    name: web lint, types, tests, build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  secrets:
    name: secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --config /repo/.gitleaks.toml --exit-code 1
      - name: gitleaks self-test (a planted fake key must be detected)
        run: |
          mkdir -p /tmp/leaktest
          # Assembled at runtime so the fake key never exists in the repository.
          printf 'GITHUB_TOKEN = "ghp_%s"\n' "$(printf 'a1B2c3D4e5%.0s' 1 2 3)abcdef" > /tmp/leaktest/config.py
          if docker run --rm -v /tmp/leaktest:/scan ghcr.io/gitleaks/gitleaks:v8.30.1 dir /scan --exit-code 1; then
            echo "::error::gitleaks did not detect the planted key"; exit 1
          fi
