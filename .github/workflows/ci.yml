name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: lint, types, unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov=rechnungsfluss --cov-report=term-missing --cov-fail-under=90

  secrets:
    name: secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --config /repo/.gitleaks.toml --exit-code 1
      - name: gitleaks self-test (a planted fake key must be detected)
        run: |
          mkdir -p /tmp/leaktest
          # Assembled at runtime so the fake key never exists in the repository.
          printf 'GITHUB_TOKEN = "ghp_%s"\n' "$(printf 'a1B2c3D4e5%.0s' 1 2 3)abcdef" > /tmp/leaktest/config.py
          if docker run --rm -v /tmp/leaktest:/scan ghcr.io/gitleaks/gitleaks:v8.30.1 dir /scan --exit-code 1; then
            echo "::error::gitleaks did not detect the planted key"; exit 1
          fi
